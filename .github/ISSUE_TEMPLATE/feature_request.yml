name: Suggest an improvement
description: Describe a task that SuperBrain could help you complete more clearly or reliably.
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: |
        Start with the task you are trying to complete. A specific example helps us understand the need. Suggestions do not create a delivery commitment.

        This report will be public. Use fictional examples and keep company records, personal information and credentials out.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: This request and its attachments contain no private company data, personal information or credentials.
          required: true
        - label: I searched existing issues for a similar request.
          required: true
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the task and when it comes up. Use a fictional example.
      placeholder: "For example: before a project review, I want to find the decision that changed its scope."
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: What gets in the way today?
      description: Describe what you tried in the preview or your current workaround.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a successful outcome look like?
      description: Explain how you would know the task had become easier or more reliable. You can suggest an approach, but the outcome matters most.
    validations:
      required: true
  - type: input
    id: platform-version
    attributes:
      label: Platform and app version, if relevant
      placeholder: "For example: Apple Silicon Mac, 0.3.0-preview.1"
